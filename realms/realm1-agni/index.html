<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AYMPON 144 — Temple Awakening</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

/* TEMPLE BACKGROUND */

#temple{
  position:absolute;
  width:100%;
  height:100%;

  background:
  radial-gradient(circle at center,
  rgba(255,120,0,0.15),
  black 70%);

}

/* FLOOR */

#floor{
  position:absolute;
  bottom:0;
  width:100%;
  height:180px;

  background:
  linear-gradient(to top,
  #111,
  transparent);

  border-top:
  2px solid rgba(255,120,0,0.3);
}

/* PILLARS */

.pillar{
  position:absolute;
  bottom:180px;

  width:60px;
  height:320px;

  background:
  linear-gradient(to bottom,
  #222,
  #000);

  box-shadow:
  0 0 20px rgba(255,120,0,0.3);
}

#pillar1{ left:40px; }
#pillar2{ right:40px; }

/* FIRE PARTICLES */

.fire{
  position:absolute;

  width:20px;
  height:20px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  yellow,
  orange,
  red);

  box-shadow:
  0 0 20px orange,
  0 0 40px red;

  animation:floatFire 5s linear infinite;
}

@keyframes floatFire{

  0%{
    transform:translateY(100vh);
    opacity:1;
  }

  100%{
    transform:translateY(-100px);
    opacity:0;
  }

}

/* TITLE */

#title{
  position:absolute;
  top:30px;
  width:100%;
  text-align:center;

  color:orange;
  font-size:36px;

  text-shadow:
  0 0 20px red;
}

/* RUSTY ARRIVAL */

#rustyAura{

  position:absolute;

  top:180px;
  left:50%;

  transform:translateX(-50%);

  width:220px;
  height:220px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(255,0,120,0.8),
  rgba(80,0,80,0.1));

  filter:blur(20px);

  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%{ transform:translateX(-50%) scale(1);}
  50%{ transform:translateX(-50%) scale(1.1);}
  100%{ transform:translateX(-50%) scale(1);}
}

/* RUSTY */

#rusty{

  position:absolute;

  top:150px;
  left:50%;

  transform:translateX(-50%);

  width:180px;
  height:280px;

  border-radius:30px;

  background:
  linear-gradient(to bottom,
  #7b0f8f,
  black);

  box-shadow:
  0 0 40px purple,
  0 0 80px red;

  animation:floatRusty 4s ease-in-out infinite;
transition: all 0.3s ease;
}

@keyframes floatRusty{

  0%{
    transform:translateX(-50%)
    translateY(0px);
  }

  50%{
    transform:translateX(-50%)
    translateY(-15px);
  }

  100%{
    transform:translateX(-50%)
    translateY(0px);
  }

}

/* EYES */

.eye{
  position:absolute;

  top:80px;

  width:20px;
  height:20px;

  background:red;

  border-radius:50%;

  box-shadow:
  0 0 15px red,
  0 0 30px red;
}

#eye1{ left:50px; }
#eye2{ right:50px; }

/* HAND */

#hand{

  position:absolute;

  bottom:120px;
  left:50%;

  transform:translateX(-50%);

  width:120px;
  height:120px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  cyan,
  blue);

  box-shadow:
  0 0 30px cyan,
  0 0 60px blue;

  animation:handPulse 2s infinite;
}

@keyframes handPulse{

  0%{
    transform:translateX(-50%) scale(1);
  }

  50%{
    transform:translateX(-50%) scale(1.08);
  }

  100%{
    transform:translateX(-50%) scale(1);
  }

}

/* MESSAGE */

#message{

  position:absolute;

  bottom:40px;
  width:100%;

  text-align:center;

  color:white;
  font-size:24px;

  text-shadow:
  0 0 10px orange;
}
/* FIREBALL */

#fireball{

  position:absolute;

  top:260px;
  left:50%;

  transform:translateX(-50%);

  width:70px;
  height:70px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  yellow,
  orange,
  red);

  box-shadow:
  0 0 20px orange,
  0 0 50px red;

  animation:
  spinFire 2s linear infinite,
  firePulse 1.5s infinite;
}

@keyframes spinFire{

  0%{
    transform:
    translateX(-50%)
    rotate(0deg);
  }

  100%{
    transform:
    translateX(-50%)
    rotate(360deg);
  }

}

@keyframes firePulse{

  0%{
    scale:1;
  }

  50%{
    scale:1.2;
  }

  100%{
    scale:1;
  }

}

/* EYE GLOW */

.eye{

  animation:
  eyePulse 1s infinite;
}

@keyframes eyePulse{

  0%{
    opacity:0.5;
  }

  50%{
    opacity:1;
  }

  100%{
    opacity:0.5;
  }

  }
</style>
</head>

<body>

<div id="temple"></div>

<div id="floor"></div>

<div class="pillar" id="pillar1"></div>
<div class="pillar" id="pillar2"></div>

<div id="title">
AYMPON 144
</div>

<div id="rustyAura"></div>

<div id="rusty">
<div id="fireball"></div>
  <div class="eye" id="eye1"></div>
  <div class="eye" id="eye2"></div>

</div>

<div id="hand"></div>

<div id="message">
Rusty awakens the Agni Realm 🔥
</div>

<script>

/* FIRE PARTICLES */

function createFire(){

  let fire =
  document.createElement("div");

  fire.classList.add("fire");

  fire.style.left =
  Math.random() *
  window.innerWidth + "px";

  fire.style.animationDuration =
  (3 + Math.random()*3) + "s";

  document.body.appendChild(fire);

  setTimeout(()=>{
    fire.remove();
  },6000);

}

setInterval(createFire,300);

/* HAND MOVE */

let hand =
document.getElementById("hand");

document.addEventListener(
"touchmove",
(e)=>{

  let x =
  e.touches[0].clientX;

  hand.style.left =
  x + "px";

});

</script>

</body>
</html>
