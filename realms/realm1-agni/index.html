<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AYMPON 144 — AGNI AWAKENING</title>

<style>

body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

/* FIRE BACKGROUND */

body::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;

  background:
  radial-gradient(circle at center,
  rgba(255,120,0,0.4),
  black 70%);

  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%{opacity:0.7;}
  50%{opacity:1;}
  100%{opacity:0.7;}
}

/* TITLE */

#title{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  color:orange;
  font-size:32px;
  text-shadow:0 0 20px red;
}

/* RUSTY */

#rusty{
  position:absolute;
  top:80px;
  left:50%;
  transform:translateX(-50%);

  width:180px;
  height:260px;

  background:
  linear-gradient(to bottom,
  purple,
  black);

  border-radius:20px;

  box-shadow:
  0 0 40px purple,
  0 0 80px red;

  animation:float 3s infinite ease-in-out;
}

@keyframes float{
  0%{transform:translateX(-50%) translateY(0);}
  50%{transform:translateX(-50%) translateY(-10px);}
  100%{transform:translateX(-50%) translateY(0);}
}

/* EYES */

.eye{
  position:absolute;
  top:70px;
  width:18px;
  height:18px;
  background:red;
  border-radius:50%;

  box-shadow:0 0 15px red;
}

#eye1{ left:55px; }
#eye2{ right:55px; }

/* MAGIC FIRE */

.fire{
  position:absolute;
  width:25px;
  height:25px;

  background:
  radial-gradient(circle,
  yellow,
  orange,
  red);

  border-radius:50%;

  box-shadow:
  0 0 20px orange,
  0 0 40px red;

  animation:fall 3s linear infinite;
}

@keyframes fall{
  0%{
    top:-50px;
  }
  100%{
    top:100vh;
  }
}

/* MYSTIC HAND */

#hand{
  position:absolute;

  bottom:80px;
  left:50%;

  transform:translateX(-50%);

  width:120px;
  height:120px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  cyan,
  blue);

  box-shadow:
  0 0 30px cyan,
  0 0 60px blue;

  animation:energy 2s infinite;
}

@keyframes energy{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.08);}
  100%{transform:translateX(-50%) scale(1);}
}

/* TEXT */

#message{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;

  color:white;
  font-size:20px;
}

</style>
</head>

<body>

<div id="title">
  AYMPON 144 — AGNI AWAKENING
</div>

<!-- Rusty -->
<div id="rusty">

  <div class="eye" id="eye1"></div>
  <div class="eye" id="eye2"></div>

</div>

<!-- Mystic Hand -->
<div id="hand"></div>

<div id="message">
  Rusty has awakened the Agni Realm 🔥
</div>

<script>

/* FIRE CREATION */

function createFire(){

  let fire = document.createElement("div");

  fire.classList.add("fire");

  fire.style.left =
  Math.random() * window.innerWidth + "px";

  document.body.appendChild(fire);

  setTimeout(()=>{
    fire.remove();
  },3000);

}

setInterval(createFire,500);

/* MOBILE HAND MOVE */

let hand =
document.getElementById("hand");

document.addEventListener(
"touchmove",
(e)=>{

  let x =
  e.touches[0].clientX;

  hand.style.left =
  x + "px";

});

</script>

</body>
</html>
