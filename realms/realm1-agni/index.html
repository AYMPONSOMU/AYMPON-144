<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGNI TRIAL</title>

<style>

body {
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
  color:white;
}

/* Player */
#player {
  width:40px;
  height:40px;
  background:cyan;
  position:absolute;
  bottom:50px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  box-shadow:0 0 20px cyan;
}

/* Fire */
.fire {
  width:40px;
  height:40px;
  background:orange;
  position:absolute;
  top:0;
  border-radius:10px;
  box-shadow:0 0 20px red;
  animation: fall 2s linear infinite;
}

@keyframes fall {
  0% { top:-50px; }
  100% { top:100vh; }
}

/* UI */
#ui {
  position:fixed;
  top:10px;
  left:10px;
  color:orange;
  font-size:18px;
}

#gameOver {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:red;
  display:none;
}

</style>
</head>

<body>

<div id="ui">Energy: 0</div>
<div id="gameOver">YOU BECAME ASH ☠️</div>

<div id="player"></div>

<script>

let player = document.getElementById("player");
let ui = document.getElementById("ui");
let gameOverText = document.getElementById("gameOver");

let energy = 0;
let gameOver = false;

/* Move Player */
document.addEventListener("keydown", (e) => {

  let left = player.offsetLeft;

  if(e.key === "ArrowLeft") {
    player.style.left = left - 20 + "px";
  }

  if(e.key === "ArrowRight") {
    player.style.left = left + 20 + "px";
  }

});

/* Create Fire */
function createFire() {

  if(gameOver) return;

  let fire = document.createElement("div");
  fire.classList.add("fire");

  fire.style.left = Math.random() * window.innerWidth + "px";

  document.body.appendChild(fire);

  /* Collision check */
  setInterval(() => {

    let p = player.getBoundingClientRect();
    let f = fire.getBoundingClientRect();

    if (
      p.left < f.left + 40 &&
      p.left + 40 > f.left &&
      p.top < f.top + 40 &&
      p.bottom > f.top
    ) {
      gameOver = true;
      gameOverText.style.display = "block";
    }

  }, 50);

  /* Remove fire after time */
  setTimeout(() => {
    fire.remove();

    if(!gameOver) {
      energy += 50;
      ui.innerHTML = "Energy: " + energy;
    }

  }, 2000);

}

setInterval(createFire, 800);

</script>

</body>
</html>
