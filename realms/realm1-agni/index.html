<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGNI TRIAL</title>

<style>

body {
  margin:0;
  background:black;
  overflow:hidden;
  font-family:Arial;
}

/* PLAYER (HAND STYLE) */
#player {
  width:50px;
  height:50px;
  background:deepskyblue;
  position:absolute;
  bottom:60px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50%;

  box-shadow:0 0 25px deepskyblue;

  /* hand feel animation */
  animation: handMove 0.6s infinite alternate;
}

@keyframes handMove {
  0% { transform:translateX(-50%) scale(1); }
  100% { transform:translateX(-50%) scale(1.1); }
}

/* FIRE IMAGE STYLE */
.fire {
  width:50px;
  height:50px;
  position:absolute;
  top:-60px;
  background:
radial-gradient(circle, yellow 0%, orange 40%, red 70%);

box-shadow:
0 0 20px orange,
0 0 40px red;
  animation: fall 2s linear;
}

@keyframes fall {
  0% { top:-60px; }
  100% { top:100vh; }
}

/* UI */
#ui {
  position:fixed;
  top:10px;
  left:10px;
  color:orange;
  font-size:18px;
}

#gameOver {
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:40px;
  color:red;
  display:none;
}

</style>
</head>

<body>

<div id="ui">Energy: 0</div>
<div id="gameOver">YOU BECAME ASH ☠️</div>

<div id="player"></div>

<script>

let player = document.getElementById("player");
let ui = document.getElementById("ui");
let gameOverText = document.getElementById("gameOver");

let energy = 0;
let gameOver = false;

/* SMOOTH MOVE */
let playerX = window.innerWidth / 2;

/* MOBILE TOUCH MOVE */

let touching = false;

document.addEventListener("touchstart", () => {
  touching = true;
});

document.addEventListener("touchend", () => {
  touching = false;
});

document.addEventListener("touchmove", (e) => {

  if(gameOver) return;

  let touchX = e.touches[0].clientX;

  player.style.left = touchX + "px";

});

/* FIRE CREATION */
function createFire() {

  if(gameOver) return;

  let fire = document.createElement("div");
  fire.classList.add("fire");

  fire.style.left = Math.random() * window.innerWidth + "px";

  document.body.appendChild(fire);

  /* collision */
  let check = setInterval(() => {

    let p = player.getBoundingClientRect();
    let f = fire.getBoundingClientRect();

    if (
      p.left < f.left + 40 &&
      p.left + 40 > f.left &&
      p.top < f.top + 40 &&
      p.bottom > f.top
    ) {
      gameOver = true;
      gameOverText.style.display = "block";
    }

  }, 50);

  setTimeout(() => {
    clearInterval(check);
    fire.remove();

    if(!gameOver) {
      energy += 50;
      ui.innerHTML = "Energy: " + energy;
    }

  }, 2000);

}

setInterval(createFire, 900);

</script>

</body>
</html>
