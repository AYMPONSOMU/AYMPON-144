<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>AYMPON 144</title>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:black;
}

/* BACKGROUND */

#bg{

  position:fixed;

  width:100%;
  height:100%;

  background-image:
  url("https://i.imgur.com/WVdF2V8.jpeg");

  background-size:cover;
  background-position:center;

  filter:
  brightness(0.8);

}

/* DARK OVERLAY */

#overlay{

  position:fixed;

  width:100%;
  height:100%;

  background:
  rgba(0,0,0,0.35);

}

/* TITLE */

#title{

  position:absolute;

  top:40px;
  width:100%;

  text-align:center;

  font-size:42px;

  color:orange;

  text-shadow:
  0 0 20px red,
  0 0 40px orange;

  z-index:5;

}

/* SUBTITLE */

#subtitle{

  position:absolute;

  top:100px;
  width:100%;

  text-align:center;

  color:white;

  font-size:20px;

  z-index:5;

  text-shadow:
  0 0 10px black;
}

/* BUTTONS */

.menuBtn{

  position:relative;

  width:260px;
  height:65px;

  margin:20px auto;

  border-radius:18px;

  background:
  linear-gradient(to right,
  rgba(255,120,0,0.8),
  rgba(120,0,255,0.8));

  color:white;

  font-size:24px;

  text-align:center;
  line-height:65px;

  box-shadow:
  0 0 20px orange,
  0 0 40px purple;

  z-index:5;

  animation:pulse 2s infinite;
}

@keyframes pulse{

  0%{
    scale:1;
  }

  50%{
    scale:1.05;
  }

  100%{
    scale:1;
  }

}

/* MENU AREA */

#menu{

  position:absolute;

  width:100%;

  top:280px;

  z-index:5;

}

/* ENERGY */

#energy{

  position:absolute;

  top:170px;
  left:50%;

  transform:translateX(-50%);

  width:220px;
  height:70px;

  border-radius:20px;

  background:
  rgba(0,0,0,0.6);

  border:
  2px solid orange;

  color:cyan;

  text-align:center;

  line-height:70px;

  font-size:28px;

  z-index:5;

  box-shadow:
  0 0 20px cyan;
}

/* FIRE PARTICLES */

.fire{

  position:absolute;

  width:20px;
  height:20px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  yellow,
  orange,
  red);

  box-shadow:
  0 0 20px orange,
  0 0 40px red;

  animation:floatFire 5s linear infinite;
}

@keyframes floatFire{

  0%{
    transform:translateY(100vh);
    opacity:1;
  }

  100%{
    transform:translateY(-100px);
    opacity:0;
  }

}

</style>
</head>

<body>

<div id="bg"></div>

<div id="overlay"></div>

<div id="title">
AYMPON 144
</div>

<div id="subtitle">
Mystical Energy Awakening
</div>

<div id="energy">
⚡ ENERGY : 0
</div>

<div id="menu">

  <div class="menuBtn"
  onclick="startRealm()">
  🔥 START REALM
  </div>

  <div class="menuBtn">
  🜂 YANTRA POWERS
  </div>

  <div class="menuBtn">
  🛡 ENERGY VAULT
  </div>

  <div class="menuBtn">
  👁 RUSTY LORE
  </div>

</div>

<script>

/* FIRE PARTICLES */

function createFire(){

  let fire =
  document.createElement("div");

  fire.classList.add("fire");

  fire.style.left =
  Math.random() *
  window.innerWidth + "px";

  fire.style.animationDuration =
  (3 + Math.random()*3) + "s";

  document.body.appendChild(fire);

  setTimeout(()=>{
    fire.remove();
  },6000);

}

setInterval(createFire,300);

/* START REALM */

function startRealm(){

  window.location.href =
  "realms/realm1-agni/";

}

</script>

</body>
</html>
